# Main Render configuration file
# This file is used when deploying multiple services from the root directory.
# Keep secrets out of git and set them in Render via generated values or dashboard-managed env vars.

services:
  # Backend API Service
  - type: web
    name: pca-hijab-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    buildFilter:
      paths:
        - backend/**
      ignoredPaths:
        - ShowMeTheColor/**
        - frontend/**
        - docs/**
        - "*.md"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: CLIENT_URL
        value: https://pca-hijab.vercel.app,https://noorai-ashy.vercel.app,https://noorai.vercel.app,https://pca-hijab-frontend.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: EMAIL_ENABLED
        value: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: PCA-HIJAB <onboarding@resend.dev>

  # AI API Service (ShowMeTheColor)
  - type: web
    name: showmethecolor-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./ShowMeTheColor/Dockerfile.render
    rootDir: .
    buildFilter:
      paths:
        - ShowMeTheColor/**
      ignoredPaths:
        - backend/**
        - frontend/**
        - docs/**
        - "*.md"
        - .github/**
    envVars:
      - key: PORT
        value: 8000

# Database is already created and managed separately
